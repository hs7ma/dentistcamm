<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - إيكو كونترول</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Cairo', 'sans-serif'] },
            colors: {
              primary: '#059669',
              secondary: '#475569',
            }
          }
        }
      }
    </script>
    <style>
      .login-bg {
        background: linear-gradient(135deg, #065f46 0%, #059669 50%, #34d399 100%);
        position: relative;
        overflow: hidden;
      }
      .login-bg::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }
      .input-field {
        transition: all 0.3s ease;
      }
      .input-field:focus {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.2);
      }
      .btn-login {
        background: linear-gradient(135deg, #059669 0%, #047857 100%);
        transition: all 0.3s ease;
      }
      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px -5px rgba(5, 150, 105, 0.4);
      }
      .btn-login:active {
        transform: translateY(0);
      }
      .floating-leaf {
        animation: float 6s ease-in-out infinite;
      }
      .floating-leaf:nth-child(2) {
        animation-delay: -2s;
      }
      .floating-leaf:nth-child(3) {
        animation-delay: -4s;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
      }
      .shake {
        animation: shake 0.5s ease-in-out;
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-10px); }
        40%, 80% { transform: translateX(10px); }
      }
    </style>
  </head>
  <body class="login-bg min-h-screen flex items-center justify-center p-4 font-sans">
    
    <!-- Floating decorative elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="floating-leaf absolute top-20 right-20 text-white/10 text-8xl">
        <i class="fa-solid fa-leaf"></i>
      </div>
      <div class="floating-leaf absolute bottom-32 left-16 text-white/10 text-6xl">
        <i class="fa-solid fa-seedling"></i>
      </div>
      <div class="floating-leaf absolute top-1/3 left-1/4 text-white/10 text-5xl">
        <i class="fa-solid fa-leaf"></i>
      </div>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-3xl p-8 md:p-12 w-full max-w-md relative z-10">
      
      <!-- Logo -->
      <div class="text-center mb-10">
        <div class="w-20 h-20 bg-gradient-to-br from-green-500 to-emerald-700 rounded-2xl flex items-center justify-center text-white mx-auto mb-6 shadow-xl shadow-green-500/30">
          <i class="fa-solid fa-leaf text-4xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-slate-800 mb-2">إيكو كونترول</h1>
        <p class="text-slate-500 text-lg">نظام إدارة الدفيئات الزراعية</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-6">
        
        <!-- Username -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">
            <i class="fa-solid fa-user ml-2 text-emerald-600"></i>
            اسم المستخدم
          </label>
          <input 
            type="text" 
            id="username" 
            name="username"
            required
            autocomplete="username"
            class="input-field w-full px-5 py-4 bg-slate-50 border-2 border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:bg-white text-lg"
            placeholder="أدخل اسم المستخدم"
          >
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">
            <i class="fa-solid fa-lock ml-2 text-emerald-600"></i>
            كلمة المرور
          </label>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              name="password"
              required
              autocomplete="current-password"
              class="input-field w-full px-5 py-4 bg-slate-50 border-2 border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-emerald-500 focus:bg-white text-lg pl-14"
              placeholder="أدخل كلمة المرور"
            >
            <button 
              type="button" 
              id="togglePassword"
              class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-600 transition-colors"
            >
              <i class="fa-solid fa-eye text-xl"></i>
            </button>
          </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden p-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-center font-medium">
          <i class="fa-solid fa-circle-exclamation ml-2"></i>
          <span id="errorText">خطأ في اسم المستخدم أو كلمة المرور</span>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submitBtn"
          class="btn-login w-full py-4 text-white rounded-xl font-bold text-lg flex items-center justify-center gap-3"
        >
          <span id="btnText">تسجيل الدخول</span>
          <i id="btnIcon" class="fa-solid fa-arrow-left"></i>
          <i id="btnSpinner" class="fa-solid fa-spinner fa-spin hidden"></i>
        </button>

      </form>

      <!-- Footer -->
      <div class="mt-10 pt-6 border-t border-slate-200 text-center">
        <p class="text-slate-400 text-sm">
          <i class="fa-solid fa-shield-halved ml-1"></i>
          محمي بنظام تسجيل دخول آمن
        </p>
      </div>

    </div>

    <!-- Version Badge -->
    <div class="fixed bottom-4 left-4 text-white/50 text-sm font-mono">
      v2.0
    </div>

    <script>
      // Check if already logged in
      const token = localStorage.getItem('eco_token');
      if (token) {
        // Verify token
        fetch('/api/auth/verify', {
          headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(data => {
          if (data.ok) {
            window.location.href = '/';
          } else {
            localStorage.removeItem('eco_token');
            localStorage.removeItem('eco_user');
          }
        })
        .catch(() => {
          localStorage.removeItem('eco_token');
          localStorage.removeItem('eco_user');
        });
      }

      // Toggle password visibility
      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      
      togglePassword.addEventListener('click', () => {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        togglePassword.innerHTML = type === 'password' 
          ? '<i class="fa-solid fa-eye text-xl"></i>' 
          : '<i class="fa-solid fa-eye-slash text-xl"></i>';
      });

      // Form submission
      const loginForm = document.getElementById('loginForm');
      const errorMessage = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');
      const btnSpinner = document.getElementById('btnSpinner');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        // Reset error
        errorMessage.classList.add('hidden');
        
        // Loading state
        submitBtn.disabled = true;
        btnText.textContent = 'جاري التحقق...';
        btnIcon.classList.add('hidden');
        btnSpinner.classList.remove('hidden');

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json();

          if (data.ok) {
            // Save token and user info
            localStorage.setItem('eco_token', data.token);
            localStorage.setItem('eco_user', JSON.stringify(data.user));
            
            // Check if there's a redirect URL (for AI page access)
            const redirectUrl = localStorage.getItem('redirect_after_login');
            if (redirectUrl) {
              localStorage.removeItem('redirect_after_login');
              window.location.href = redirectUrl;
            } else {
              // Normal redirect based on role
              if (data.user.role === 'admin') {
                window.location.href = '/admin.html';
              } else {
                window.location.href = '/';
              }
            }
          } else {
            // Show error
            errorText.textContent = data.error || 'خطأ في تسجيل الدخول';
            errorMessage.classList.remove('hidden');
            loginForm.classList.add('shake');
            setTimeout(() => loginForm.classList.remove('shake'), 500);
          }
        } catch (error) {
          errorText.textContent = 'خطأ في الاتصال بالخادم';
          errorMessage.classList.remove('hidden');
        } finally {
          // Reset button
          submitBtn.disabled = false;
          btnText.textContent = 'تسجيل الدخول';
          btnIcon.classList.remove('hidden');
          btnSpinner.classList.add('hidden');
        }
      });
    </script>

  </body>
</html>
